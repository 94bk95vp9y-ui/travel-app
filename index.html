    <title>Fernweh</title>
    <style>
      html, body { background: #05070f; margin: 0; height: 100%; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #05070f;
        transition: opacity 0.5s ease;
      }
      #boot .wrap { display: flex; flex-direction: column; align-items: center; gap: 26px; margin-top: -40px; }
      #boot .name {
        font: 800 7.5vw -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif; letter-spacing: -0.03em;
        background: linear-gradient(140deg, #ffe3a6, #ffb547 50%, #ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #boot .orb {
        width: 25vw; height: 25vw; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #2b4a8f 0%, #0d1838 55%, #060b1c 100%);
        box-shadow: 0 0 60px 8px rgba(91, 140, 255, 0.28), inset -10px -12px 24px rgba(0, 0, 0, 0.5);
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes boot-pulse { 50% { transform: scale(1.06); box-shadow: 0 0 80px 14px rgba(91, 140, 255, 0.35), inset -10px -12px 24px rgba(0, 0, 0, 0.5); } }
    </style>

    <div id="boot"><div class="wrap"><div class="orb"></div><div class="name">Fernweh</div></div></div>
